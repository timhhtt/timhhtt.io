  font-size:clamp(2.6rem,7vw,4.2rem);

<body>
<canvas id="bgCanvas"></canvas>
<div class="container">
  <div class="glass-card">
    <h1>暗物质裂隙</h1>
    <p class="subtitle">液态金属 · 电弧扰动 · 时空裂隙<br>个人主页 / 项目作品集</p>
    <div class="link-group">
      <a href="#projects">项目</a>

      <a href="#contact">联系</a>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

let time = 0;
const linesCount = 120;
function loop(){
  time += 0.008;
  ctx.fillStyle = 'rgba(0,0,3,0.12)';
  ctx.fillRect(0,0,w,h);
  const cx = w/2;
  const cy = h/2;

  for(let i=0; i<linesCount; i++){
    const baseAngle = (i / linesCount) * Math.PI * 2;
    ctx.beginPath();    上下文.开始路径();
    for(let r=400; r>20; r -= 12){    对于(让 r=400; r>20; r -= 12){
      const twist = time * 0.4 + r * 0.0035;
      const angle = baseAngle + twist;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if(r === 400) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    const alpha = 0.08 + Math.sin(time*2 + i) * 0.06;
    ctx.strokeStyle = `rgba(160, 190, 240, ${alpha})`;
    ctx.lineWidth = 0.45;
    ctx.stroke();
  }
  requestAnimationFrame(loop);
}
loop();循环();
</script脚本></脚本>
