<script>
// 暗物质涡旋背景动画（我本地跑过，完全正常）
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let w, h;

// 适配屏幕大小
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let time = 0;
const linesCount = 130; // 线条数量，越多越密

function animate(){
  time += 0.008;
  // 渐变拖影，形成流动效果
  ctx.fillStyle = 'rgba(0,0,3,0.12)';
  ctx.fillRect(0,0,w,h);
  
  const cx = w/2;
  const cy = h/2;
  const maxR = Math.min(w, h) * 0.85; // 涡旋占满屏幕

  // 绘制每一条螺旋线
  for(let i=0; i<linesCount; i++){
    const baseAngle = (i / linesCount) * Math.PI * 2;
    ctx.beginPath();    上下文.开始路径();
    
    for(let r=maxR; r>25; r -= 12){    对于(让 r=maxR; r>25; r -= 12){
      // 螺旋扭曲效果
      const twist = time * 0.42 + r * 0.0038;
      const angle = baseAngle + twist;
      
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      
      if(r === maxR) ctx.moveTo(x, y);      如果(r === maxR) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);      否则 ctx.lineTo(x, y);
    }
    
    // 线条透明度，轻微呼吸动效
    const alpha = 0.07 + Math.sin(time*2.1 + i*0.1) * 0.05;
    ctx.strokeStyle = `rgba(160, 190, 240, ${alpha})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  requestAnimationFrame(animate);
}
// 启动动画
animate();动画();
</script></脚本>
