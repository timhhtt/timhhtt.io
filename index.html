<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗物质裂隙 | timhhtt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#020204;
  color:#e6e6e6;
  font-family:system-ui, sans-serif;
  overflow-x:hidden;
}
/* 背景：暗物质裂隙画布 */
#bgCanvas{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  z-index:-1;
}
/* 液态金属玻璃面板 */
.container{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2rem;
}
.glass-card{
  background: rgba(12,14,22,0.35);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(110, 160, 255, 0.18);
  border-radius:16px;
  padding:3rem;
  max-width:800px;
  position:relative;
  overflow:hidden;
}
/* 电弧扫描线动画 */
.glass-card::before{
  content:"";
  position:absolute;
  top:-100%;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(transparent, rgba(120,180,255,0.22), transparent);
  animation: arcScan 4.2s infinite linear;
}
@keyframes arcScan{
  0%{top:-100%}
  100%{top:100%}
}
h1{
  font-size:clamp(2.4rem,6vw,4rem);
  background:linear-gradient(90deg,#82aaff,#c792ea,#89DDFF);
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom:1rem;
}
.subtitle{
  color:#a8b2d1;
  font-size:1.1rem;
  line-height:1.7;
  margin-bottom:2rem;
}
.link-group a{
  display:inline-block;
  color:#9cdcfe;
  text-decoration:none;
  border:1px solid rgba(130,170,255,0.4);
  padding:0.8rem 1.6rem;
  border-radius:8px;
  margin:0.5rem;
  transition:0.3s;
}
.link-group a:hover{
  background:rgba(110,160,255,0.12);
  box-shadow:0 0 16px rgba(110,160,255,0.35);
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="container">
  <div class="glass-card">
    <h1>暗物质裂隙</h1>
    <p class="subtitle">液态金属 · 电弧扰动 · 时空裂隙<br>个人主页 / 项目作品集</p>
    <div class="link-group">
      <a href="#projects">项目</a>
      <a href="#about">关于我</a>
      <a href="#contact">联系</a>
    </div>
  </div>
</div>

<script>
// 暗物质裂隙 + 电弧粒子背景
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

// 裂隙中心
const center = {x:w/2,y:h/2};
let time = 0;
class Particle{
  constructor(){
    this.reset();
  }
  reset(){
    this.angle = Math.random() * Math.PI*2;
    this.radius = Math.random() * Math.min(w,h)*0.7;
    this.speed = 0.003 + Math.random()*0.006;
    this.size = Math.random()*1.8+0.3;
    this.alpha = Math.random()*0.4+0.1;
  }
  update(){
    this.angle += this.speed;
    const wobble = Math.sin(time*2.2 + this.radius*0.012)*30;
    this.x = center.x + Math.cos(this.angle)*(this.radius + wobble);
    this.y = center.y + Math.sin(this.angle)*(this.radius + wobble);
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle = `rgba(140,175,255,${this.alpha})`;
    ctx.fill();
  }
}
const particles = Array.from({length:320},()=>new Particle());

// 电弧分支函数
function drawArc(startX,startY,len,angle,depth){
  if(depth < 1 || len < 3) return;
  ctx.beginPath();
  ctx.moveTo(startX,startY);
  let x = startX;
  let y = startY;
  const seg = 6;
  for(let i=0;i<seg;i++){
    angle += (Math.random()-0.5)*0.55;
    x += Math.cos(angle)*len/seg;
    y += Math.sin(angle)*len/seg;
    ctx.lineTo(x,y);
  }
  ctx.strokeStyle = `rgba(135,190,255,${0.25+Math.random()*0.35})`;
  ctx.lineWidth = 0.6;
  ctx.stroke();
  if(Math.random()>0.4){
    drawArc(x,y,len*0.65,angle + (Math.random()-0.5)*1.1,depth-1);
  }
}

function loop(){
  time += 0.016;
  ctx.fillStyle = 'rgba(2,2,4,0.18)';
  ctx.fillRect(0,0,w,h);
  center.x = w/2 + Math.sin(time*0.45)*60;
  center.y = h/2 + Math.cos(time*0.33)*40;

  // 绘制旋转裂隙粒子
  particles.forEach(p=>{
    p.update();p.draw();
  })

  // 随机电弧闪现
  if(Math.sin(time*7) > 0.88){
    drawArc(center.x,center.y, 120, Math.random()*Math.PI*2, 4);
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
