<head>

<canvas id="bgCanvas" aria-hidden="true"></canvas>

      你竟然不知道我联系方式<br>

    </p>

    <div class="contact-channels reveal" style="--stagger:0.45s">
      <a class="channel" href="https://github.com/timhhtt" target="_blank" rel="noopener">▸ GITHUB / timhhtt</a>

  </section>
</main>

<script src="js/main.js"></script>
