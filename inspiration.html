<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵感 · TIMHHTT</title>
<meta name="description" content="TIMHHTT 的视觉灵感画廊。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,6 90,35 74,92 26,92 10,35' fill='%23130f2e' stroke='%23b47aff' stroke-width='6'/%3E%3Cpolygon points='50,26 68,48 50,78 32,48' fill='%23c792ea'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="page-bg" aria-hidden="true"></div>

<main class="page-main">
  <header class="section page-hero reveal">
    <h1 class="page-title">灵感</h1>
    <p class="page-sub">收藏的那些光与碎片
      <span class="page-sub-en">Inspiration · Fragments Of Light</span>
    </p>
    <div class="divider"></div>
  </header>

  <section class="section" style="padding-top:0; padding-bottom:4rem">
    <div class="masonry" id="masonry"><!-- JS 渲染 --></div>
  </section>
</main>

<script src="js/main.js"></script>
<script>
/* ★ 如何添加图片：
   1. 把图片放进 assets/img/ 目录（建议宽度 800px 以上）；
   2. 在下面 GALLERY 数组里加一项 { src: "assets/img/文件名.jpg", caption: "说明文字" }。
   图片高度不限，瀑布流会自动排列。 */
var GALLERY = [
  { src: "assets/img/hero-planet.jpg", caption: "暗物质裂隙 · 首页主视觉" }
];

document.addEventListener("DOMContentLoaded", function () {
  var box = document.getElementById("masonry");
  if (!box) return;
  box.innerHTML = GALLERY.map(function (g, i) {
    return (
      '<figure class="masonry-item" style="--stagger:' + (i * 0.08) + 's">' +
        '<img src="' + g.src + '" alt="' + (g.caption || "灵感图") + '" loading="lazy">' +
        (g.caption ? "<figcaption>" + g.caption + "</figcaption>" : "") +
      "</figure>"
    );
  }).join("");
});
</script>
</body>
</html>
